services:
  db:
    image: postgres:15
    restart: always
    container_name: participium_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  test_db:
    image: postgres:15
    restart: always
    container_name: participium_test_db
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  participium:
    image: skeitt/participium-team-4:latest
    container_name: participium
    ports:
      - "3000:3000"
      - "4000:4000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma generate && npm start & npm run chat_server & wait"

  telegram_bot:
    image: skeitt/participium-team-4-bot:latest
    container_name: participium_bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - participium

volumes:
  pgdata:
  pgdata_test:
